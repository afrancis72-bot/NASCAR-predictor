name: NASCAR race-first tests
on:
  push:
    branches: [feature/race-first-simulation-v215]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      - name: Fetch historical Cup results
        run: curl --fail --location --retry 3 --max-time 90 https://nascar.kylegrealis.com/cup_series.csv -o cup_series.csv
      - name: Historical rolling-origin benchmark
        run: python historical_backtest.py --season 2025 --races 8 --sims 1200
